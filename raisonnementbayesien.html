<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raisonnement bayésien</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1d2330;
    --muted: #667085;
    --line: #d5d9e0;
    --h1: #2563eb;
    --h2: #e8710a;
    --accent: #7c3aed;
    --thumb: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px 12px;
    margin-bottom: 14px;
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 2px; }

  .hyp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .hyp label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
  .hyp input {
    width: 100%; padding: 8px 10px; font: inherit;
    border: 2px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text);
  }
  .hyp .h1 input { border-color: var(--h1); }
  .hyp .h2 input { border-color: var(--h2); }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .presets span { font-size: .85rem; color: var(--muted); }
  .presets button {
    font: inherit; font-size: .85rem; padding: 6px 12px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--text);
  }
  .presets button:hover { border-color: var(--accent); color: var(--accent); }

  /* pistes */
  .slider { position: relative; height: var(--thumb); margin-top: 6px; }
  .track {
    position: absolute; left: calc(var(--thumb) / 2); right: calc(var(--thumb) / 2);
    top: 50%; height: 8px; transform: translateY(-50%); border-radius: 4px;
    background: linear-gradient(to right, var(--h2), #e5e7eb 50%, var(--h1));
    opacity: .55;
  }
  .slider input[type=range] {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
    background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  .slider input[type=range]::-webkit-slider-runnable-track { background: transparent; height: var(--thumb); }
  .slider input[type=range]::-moz-range-track { background: transparent; height: var(--thumb); }
  .slider input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; box-sizing: border-box; width: var(--thumb); height: var(--thumb); border-radius: 50%;
    background: #fff; border: 3px solid var(--text); box-shadow: 0 1px 4px #0003;
  }
  .slider input[type=range]::-moz-range-thumb {
    box-sizing: border-box; width: var(--thumb); height: var(--thumb); border-radius: 50%;
    background: #fff; border: 3px solid var(--text); box-shadow: 0 1px 4px #0003;
  }
  .slider input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 12px; }


  .readout { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; margin-top: 4px; }
  .readout { font-size: 1rem; }

  .op { text-align: center; font-size: 1.6rem; color: var(--muted); margin: -4px 0 6px; line-height: 1; }

  /* sliders a posteriori */
  .post { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .post .track { opacity: .55; }
  .marker {
    position: absolute; top: 50%; width: var(--thumb); height: var(--thumb); border-radius: 50%;
    transform: translate(-50%, -50%); transition: left .12s;
  }
  .marker.result.off { background: #fff; border: 3px solid var(--accent); }
  .marker.result { background: var(--accent); border: 3px solid #fff; box-shadow: 0 1px 5px #0005; }



  @media (max-width: 560px) {
    .hyp { grid-template-columns: 1fr; }
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171f; --card: #1c212c; --text: #e8eaf0; --muted: #9aa3b5; --line: #353c4b; --h1: #5b8def; --h2: #f59a47; --accent: #a78bfa; }
    .track { background: linear-gradient(to right, var(--h2), #3a4150 50%, var(--h1)); }
      .marker.result { border-color: var(--card); }
    .slider input[type=range]::-webkit-slider-thumb, .slider input[type=range]::-moz-range-thumb { background: var(--card); }
  }
</style>
</head>
<body>
<main>
  <h1>Raisonnement bayésien</h1>
  <div class="hyp">
    <div class="h1"><label for="n1">Hypothèse 1</label><input id="n1" value="H1" maxlength="40"></div>
    <div class="h2"><label for="n2">Hypothèse 2</label><input id="n2" value="H2" maxlength="40"></div>
  </div>

  <div class="presets">
    <span>Exemples&nbsp;:</span>
    <button type="button" data-p="medical">Test médical</button>
    <button type="button" data-p="adn">Preuve ADN</button>
    <button type="button" data-p="extra">Affirmation extraordinaire</button>
  </div>

  <section class="card" id="c-prior">
    <h2>1. Ratio a priori</h2>
    <div class="slider"><div class="track"></div><input type="range" id="prior" min="-24" max="24" step="1" value="0" aria-label="Ratio a priori"></div>
    <div class="readout"></div>
  </section>

  <div class="op" aria-hidden="true">×</div>

  <section class="card" id="c-lik">
    <h2>2. Rapport de vraisemblance</h2>
    <div class="slider"><div class="track"></div><input type="range" id="lik" min="-24" max="24" step="1" value="0" aria-label="Rapport de vraisemblance"></div>
    <div class="readout"></div>
  </section>

  <div class="op" aria-hidden="true">=</div>

  <section class="card post" id="c-post">
    <h2>3. Ratio a posteriori</h2>
    <div class="slider">
      <div class="track"></div>
      <div class="marker result"></div>
    </div>
    <div class="readout"></div>
  </section>
</main>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const THUMB = 24;
  const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
  const sup = n => String(n).split("").map(c => SUP[c]).join("");

  const prior = $("#prior"), lik = $("#lik");
  const n1 = $("#n1"), n2 = $("#n2");
  const name1 = () => n1.value.trim() || "H1";
  const name2 = () => n2.value.trim() || "H2";

  const pos = (v, max) => `calc(${THUMB / 2}px + (100% - ${THUMB}px) * ${(v + max) / (2 * max)})`;

  // ---------- mise en forme ----------
  function fmtNum(x) {
    // x >= 1
    if (x >= 1e6) {
      const e = Math.floor(Math.log10(x));
      const m = x / Math.pow(10, e);
      const ms = (Math.round(m * 10) / 10).toString().replace(".", ",");
      return ms === "1" ? `10${sup(e)}` : `${ms} × 10${sup(e)}`;
    }
    const sig = x >= 100 ? Math.round(x) : Math.round(x * 10) / 10;
    const r = x >= 100 ? sigRound(sig, 3) : sig;
    return r.toLocaleString("fr-FR");
  }
  function sigRound(x, n) {
    const p = Math.pow(10, Math.floor(Math.log10(x)) - n + 1);
    return Math.round(x / p) * p;
  }
  function fmtRatio(L) {
    if (Math.abs(L) < 0.005) return "1 : 1";
    const N = fmtNum(Math.pow(10, Math.abs(L)));
    return L > 0 ? `${N} : 1` : `1 : ${N}`;
  }
  function fmtPct(t) {
    const pct = t * 100;
    if (pct < 0.01) return "< 0.01%";
    if (pct > 99.99) return "> 99.99%";
    return pct.toFixed(2) + "%";
  }
  const probH1 = L => 1 / (1 + Math.pow(10, -L));

  // ---------- crans : 1, 2, 5, 10, 20, 50, 100… (de part et d'autre de 1 : 1) ----------
  const MANT = [1, 2, 5];
  const idxToL = i => Math.sign(i) * (Math.floor((Math.abs(i)) / 3) + Math.log10(MANT[Math.abs(i) % 3]));
  // r > 0 : r contre 1 ; r < 0 : 1 contre |r|
  const ratioToIdx = r => {
    const a = Math.abs(r), k = Math.floor(Math.log10(a) + 1e-9);
    return Math.sign(r) * (3 * k + MANT.indexOf(Math.round(a / Math.pow(10, k))));
  };

  // ---------- mise à jour ----------
  function update() {
    const a = name1(), b = name2();
    const Lp = idxToL(+prior.value), Ll = idxToL(+lik.value), Lq = Lp + Ll;

    readoutCard($("#c-prior"), Lp, a, b, "a priori");
    readoutCard($("#c-lik"), Ll, a, b, "vraisemblance");
    readoutCard($("#c-post"), Lq, a, b, "a posteriori");

    const res = $("#c-post .result");
    res.style.left = pos(Math.max(-8, Math.min(8, Lq)), 8);
    res.classList.toggle("off", Math.abs(Lq) > 8);
  }

  function readoutCard(card, L, a, b, label) {
    const el = $(".readout", card);
    const strong = document.createElement("strong");
    el.replaceChildren(strong);
    if (label === "vraisemblance") {
      strong.textContent = `P(preuve | ${a}) : P(preuve | ${b}) = ${fmtRatio(L)}`;
      return;
    }
    const p1 = probH1(L), p2 = 1 / (1 + Math.pow(10, L)); // p2 sans soustraction
    strong.textContent = `${a} : ${b} = ${fmtRatio(L)}`;
    el.append(` (soit P(${a})=${fmtPct(p1)} et P(${b})=${fmtPct(p2)})`);
  }

  [prior, lik].forEach(i => i.addEventListener("input", update));
  [n1, n2].forEach(i => i.addEventListener("input", update));

  // ---------- exemples ----------
  const PRESETS = {
    medical: { h1: "La personne est malade", h2: "La personne est saine", prior: -1000, lik: 20 },
    adn:     { h1: "L'accusé est le coupable", h2: "L'accusé est innocent", prior: -1e6, lik: 1e7 },
    extra:   { h1: "La télépathie existe", h2: "La télépathie n'existe pas", prior: -1e8, lik: 2 }
  };
  document.querySelectorAll(".presets button").forEach(btn => btn.addEventListener("click", () => {
    const p = PRESETS[btn.dataset.p];
    n1.value = p.h1; n2.value = p.h2; prior.value = ratioToIdx(p.prior); lik.value = ratioToIdx(p.lik);
    update();
  }));

  update();
})();
</script>
</body>
</html>
